# cargo-deny (ADR-0039, decisions 13 and 14). `cargo xtask supply-chain` runs it, and
# checks the web dependencies against the same license allow list.

[graph]
all-features = true

[advisories]
# Security advisories from RustSec. An ignored advisory needs a reason.
ignore = []
yanked = "deny"
unmaintained = "all"

[licenses]
# Licenses compatible with AGPL-3.0-or-later (ADR-0042), for the Rust crates and for
# the web dependencies shipped in the frontend. Add one only after checking that it
# is compatible.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The list is shared with the web dependencies, so a license only they use is fine.
unused-allowed-license = "allow"

[licenses.private]
# The workspace's own crates are not published; their license is ADR-0042's.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates refer to each other by path, without a version.
allow-wildcard-paths = true

[sources]
# crates.io only (ADR-0039, decision 13).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
