# Services for development (ADR-0038). Values come from .env, which `./dev up` creates from
# .env.example.
# .devcontainer/compose.workspace.yaml adds the toolchain: the devcontainer's workspace,
# and the app in development, which `./dev up` starts (ADR-0044).
name: iasion

services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (see .env.example)}
      IASION_DB_OWNER_PASSWORD: ${IASION_DB_OWNER_PASSWORD:?set it in .env (see .env.example)}
      IASION_DB_APP_PASSWORD: ${IASION_DB_APP_PASSWORD:?set it in .env (see .env.example)}
    ports:
      # Reachable from the host only.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      # Creates the owner and application roles with the production grants (ADR-0038).
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Local stand-in for Cloudflare Access's certs endpoint (ADR-0038, decision 7). It
  # serves the public half of the dev key pair that `cargo xtask dev-token` creates;
  # the private key stays one directory up and is never served.
  access-dev:
    image: busybox:1.38.0
    command: ["httpd", "-f", "-p", "8080", "-h", "/srv"]
    ports:
      - "127.0.0.1:8790:8080"
    volumes:
      - type: bind
        source: ./.dev/access/public
        target: /srv
        read_only: true
        # Docker would create a missing directory as root; fail instead (README).
        bind:
          create_host_path: false

volumes:
  db-data:
