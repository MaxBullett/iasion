[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# Internal crates. Which may depend on which is checked by `cargo xtask deps`
# against the context map (ADR-0034, decision 7).
iasion-shared-kernel = { path = "crates/shared-kernel" }
iasion-household = { path = "crates/household" }
iasion-access = { path = "crates/access" }
iasion-ledger = { path = "crates/ledger" }
iasion-classification = { path = "crates/classification" }
iasion-views = { path = "crates/views" }
iasion-app = { path = "crates/app" }
iasion-api = { path = "crates/api" }
iasion-migrations = { path = "crates/migrations" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# No unwrap or expect outside tests (docs/conventions.md); clippy.toml allows them in
# tests (ADR-0034, decision 10).
unwrap_used = "deny"
expect_used = "deny"
# Clock and randomness only in `app` and `server` (ADR-0034, decision 6).
disallowed_methods = "deny"
