# CI (ADR-0039). Job names are the required checks of the main branch ruleset; a job
# added here must be added there by hand. No path filters: a skipped required job
# would leave pull requests waiting.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit for secrets
        # The same pinned Betterleaks image as the hooks, read from the hooks' library
        # (ADR-0041).
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          image=$(sed -n 's/^BETTERLEAKS_IMAGE=//p' .githooks/lib.sh)
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$PUSH_AFTER"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$image" \
            git --log-opts="$range" --redact --no-banner .
      - name: Test the git hooks
        run: sh .githooks/test.sh

  rust:
    name: rust
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18.7
        env:
          # A throwaway database reachable only on the runner: no superuser password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      DATABASE_URL: postgres://postgres@localhost:5432/iasion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        # The version comes from rust-toolchain.toml, as in development (ADR-0038).
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Create the database roles
        # The same script as in development and on the host (ADR-0033, ADR-0038), with
        # passwords generated for this run only and masked in the logs.
        run: |
          owner=$(openssl rand -hex 24)
          app=$(openssl rand -hex 24)
          echo "::add-mask::$owner"
          echo "::add-mask::$app"
          IASION_DB_OWNER_PASSWORD=$owner IASION_DB_APP_PASSWORD=$app sh deploy/postgres/init-roles.sh
          echo "IASION_MIGRATE_DATABASE_URL=postgres://iasion_owner:$owner@localhost:5432/iasion" >>"$GITHUB_ENV"
          echo "IASION_DATABASE_URL=postgres://iasion_app:$app@localhost:5432/iasion" >>"$GITHUB_ENV"
      - name: Checks
        run: cargo xtask check
      - name: Migrations on an empty database
        # As the owner role, as on the host (ADR-0033, decision 19; ADR-0039).
        run: cargo run --quiet --package iasion-server -- migrate
      - name: The app starts on the migrated database
        # As the application role, with placeholder settings and no Access keys: it
        # must start, pass its migration check and answer its health check
        # (ADR-0040, decisions 9 and 16).
        env:
          IASION_SETUP_EMAIL: first.member@example.com
          IASION_ACCESS_TEAM_DOMAIN: example-team.cloudflareaccess.com
          IASION_ACCESS_AUD: placeholder
          IASION_PUBLIC_ORIGIN: https://iasion.example.com
          IASION_ACCESS_CERTS_URL: http://127.0.0.1:9/certs
        run: |
          cargo build --quiet --package iasion-server
          target/debug/iasion serve >serve.log 2>&1 &
          for _ in $(seq 30); do
            if target/debug/iasion health; then healthy=1; break; fi
            sleep 1
          done
          kill %1 || true
          cat serve.log
          test "${healthy:-0}" = 1
      - name: Tests
        run: cargo xtask test

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm at the version in web/package.json, Node at .node-version (ADR-0043).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned toolchain
        # For `cargo xtask`, the one entry point (ADR-0038).
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Checks
        # Frozen install, lint, format, types, Vitest, client drift (ADR-0043).
        run: cargo xtask web-check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18.7
        env:
          # A throwaway database reachable only on the runner: no superuser password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      # Placeholder settings of a development instance (.env.example).
      IASION_SETUP_EMAIL: first.member@example.com
      IASION_ACCESS_TEAM_DOMAIN: example-team.cloudflareaccess.com
      IASION_ACCESS_AUD: placeholder
      IASION_PUBLIC_ORIGIN: http://localhost:8080
      IASION_ACCESS_CERTS_URL: http://localhost:8790/certs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Create the database roles
        # As in the rust job: the init script, with passwords for this run only.
        run: |
          owner=$(openssl rand -hex 24)
          app=$(openssl rand -hex 24)
          echo "::add-mask::$owner"
          echo "::add-mask::$app"
          IASION_DB_OWNER_PASSWORD=$owner IASION_DB_APP_PASSWORD=$app sh deploy/postgres/init-roles.sh
          echo "IASION_MIGRATE_DATABASE_URL=postgres://iasion_owner:$owner@localhost:5432/iasion" >>"$GITHUB_ENV"
          echo "IASION_DATABASE_URL=postgres://iasion_app:$app@localhost:5432/iasion" >>"$GITHUB_ENV"
      - name: Build
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium firefox
          pnpm --dir web run build
          cargo build --quiet --package iasion-server --package xtask
      - name: Migrate, and stand in for Access
        # The dev key pair is created for this run only; access-dev is the same image
        # as in compose.yaml (ADR-0038, ADR-0043).
        run: |
          cargo run --quiet --package iasion-server -- migrate
          cargo xtask dev-token >/dev/null
          docker run --detach --name access-dev --publish 127.0.0.1:8790:8080 \
            --volume "$PWD/.dev/access/public:/srv:ro" busybox:1.37.0 httpd -f -p 8080 -h /srv
      - name: End-to-end tests
        # Playwright starts `iasion serve` (web/playwright.config.ts).
        run: pnpm --dir web exec playwright test
      - name: Keep the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-deny
        # The same version and checksum as in the workspace image (ADR-0039).
        env:
          CARGO_DENY_VERSION: 0.22.1
          CARGO_DENY_SHA256: 13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/"
          cargo deny --version
      - name: Checks
        # Advisories, licenses, bans and sources of the crates, and the licenses of the
        # web dependencies the frontend ships (ADR-0039, decisions 13 and 14).
        run: |
          pnpm --dir web install --frozen-lockfile
          cargo xtask supply-chain

  image:
    name: image
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18.7
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: iasion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs as on the host
        # Migrate as the owner role, then serve read-only with every capability
        # dropped, as the quadlet runs it (ADR-0040), and ask the health check and the
        # page.
        run: |
          owner=$(openssl rand -hex 24)
          app=$(openssl rand -hex 24)
          echo "::add-mask::$owner"
          echo "::add-mask::$app"
          IASION_DB_OWNER_PASSWORD=$owner IASION_DB_APP_PASSWORD=$app sh deploy/postgres/init-roles.sh
          docker run --rm --network host \
            -e IASION_MIGRATE_DATABASE_URL="postgres://iasion_owner:$owner@localhost:5432/iasion" \
            iasion:ci migrate
          docker run --detach --name app --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -e IASION_DATABASE_URL="postgres://iasion_app:$app@localhost:5432/iasion" \
            -e IASION_SETUP_EMAIL=first.member@example.com \
            -e IASION_ACCESS_TEAM_DOMAIN=example-team.cloudflareaccess.com \
            -e IASION_ACCESS_AUD=placeholder \
            -e IASION_PUBLIC_ORIGIN=https://iasion.example.com \
            -e IASION_ACCESS_CERTS_URL=http://127.0.0.1:9/certs \
            iasion:ci
          for _ in $(seq 30); do
            if docker exec app /iasion health; then healthy=1; break; fi
            sleep 1
          done
          docker logs app
          test "${healthy:-0}" = 1
          curl --fail --silent --show-error http://localhost:8080/ | grep -q '<title>Iasion</title>'

  publish:
    # Pushes the image from main only (ADR-0039, ADR-0040): ghcr.io/<repository>, tagged
    # with the commit SHA and `main`. The only job that may write packages.
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets, rust, web, e2e, supply-chain, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
