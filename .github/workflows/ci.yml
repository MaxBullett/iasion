# CI (ADR-0039). Job names are the required checks of the main branch ruleset; a job
# added here must be added there by hand. No path filters: a skipped required job
# would leave pull requests waiting.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit for secrets
        # The same pinned Betterleaks image as the hooks, read from the hooks' library
        # (ADR-0041).
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          image=$(sed -n 's/^BETTERLEAKS_IMAGE=//p' .githooks/lib.sh)
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$PUSH_AFTER"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$image" \
            git --log-opts="$range" --redact --no-banner .
      - name: Test the git hooks
        run: sh .githooks/test.sh

  rust:
    name: rust
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18.7
        env:
          # A throwaway database reachable only on the runner: no superuser password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      DATABASE_URL: postgres://postgres@localhost:5432/iasion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        # The version comes from rust-toolchain.toml, as in development (ADR-0038).
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Create the database roles
        # The same script as in development and on the host (ADR-0033, ADR-0038), with
        # passwords generated for this run only and masked in the logs.
        run: |
          owner=$(openssl rand -hex 24)
          app=$(openssl rand -hex 24)
          echo "::add-mask::$owner"
          echo "::add-mask::$app"
          IASION_DB_OWNER_PASSWORD=$owner IASION_DB_APP_PASSWORD=$app sh deploy/postgres/init-roles.sh
          echo "IASION_MIGRATE_DATABASE_URL=postgres://iasion_owner:$owner@localhost:5432/iasion" >>"$GITHUB_ENV"
          echo "IASION_DATABASE_URL=postgres://iasion_app:$app@localhost:5432/iasion" >>"$GITHUB_ENV"
      - name: Checks
        run: cargo xtask check
      - name: Migrations on an empty database
        # As the owner role, as on the host (ADR-0033, decision 19; ADR-0039).
        run: cargo run --quiet --package iasion-server -- migrate
      - name: The app starts on the migrated database
        # As the application role, with placeholder settings and no Access keys: it
        # must start, pass its migration check and answer its health check
        # (ADR-0040, decisions 9 and 16).
        env:
          IASION_SETUP_EMAIL: first.member@example.com
          IASION_ACCESS_TEAM_DOMAIN: example-team.cloudflareaccess.com
          IASION_ACCESS_AUD: placeholder
          IASION_PUBLIC_ORIGIN: https://iasion.example.com
          IASION_ACCESS_CERTS_URL: http://127.0.0.1:9/certs
        run: |
          cargo build --quiet --package iasion-server
          target/debug/iasion serve >serve.log 2>&1 &
          for _ in $(seq 30); do
            if target/debug/iasion health; then healthy=1; break; fi
            sleep 1
          done
          kill %1 || true
          cat serve.log
          test "${healthy:-0}" = 1
      - name: Tests
        run: cargo xtask test
